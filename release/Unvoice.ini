; Unvoice: voice lines from the plugins and NPCs listed below are treated as unvoiced.
;
; Under [Plugins], one plugin filename per line, including the extension, e.g.
;   SomeFollower.esp
; That mutes every line the plugin created, whoever says it.
;
; Under [NPCs], one NPC per line, by the name it has in game or as Plugin|FormID, e.g.
;   Lydia
;   Skyrim.esm|A2C94
; That mutes everything those NPCs say, from any plugin, the base game included.
; The console command  help "<name>" 4  lists the NPC records by that name, with their form IDs.
; Clicking an NPC in the console shows another ID, which won't match.
;
; Case doesn't matter. Lines starting with ; are ignored. Restart the game after editing.
; The plugins listed by default can be removed. Entries for plugins you don't have are harmless.
;
; Needs Fuz Ro D-oh. For TTS, also turn on SkyrimNet's "Voice Silent NPCs".
; To test without any other mod, list Dragonborn.esm and talk to someone on Solstheim.

